version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      runtime:
        patterns:
          - "mcp*"
          - "httpx"
          - "pydantic*"
          - "python-dotenv"
      dev:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "pre-commit"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - "ci"
      - "dependencies"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - "docker"
      - "dependencies"
